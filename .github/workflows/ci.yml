name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  windows:
    name: Windows build, test and live verify
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check PowerShell scripts parse
        run: |
          $failed = $false
          foreach ($script in Get-ChildItem scripts -Filter *.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $failed = $true; $errors | ForEach-Object { "$($script.Name): $($_.Message)" } }
          }
          if ($failed) { exit 1 }

      - name: Generate icons and train the ONNX model
        run: |
          python scripts/gen_icons.py
          python -m pip install --disable-pip-version-check numpy onnx
          python scripts/train_onnx.py --out thenex_model.onnx
          python scripts/gen_test_zipbomb.py
          python scripts/fetch_hash_list.py --self-test
          python scripts/ember_eval.py --self-test
          python scripts/ci_run.py --self-test

      # On-device hand/face models for AegisMesh's emergency signs: pinned, SHA-256 verified,
      # embedded into the apps at build time.
      - name: Fetch the vision runtime and test the sign recogniser
        run: |
          python scripts/fetch_vision_models.py
          node scripts/test_signs.js
          node scripts/test_report.js
          node scripts/test_setup.js
          node scripts/test_filecheck.js
          node scripts/test_startup.js
          node scripts/test_summary.js

      - name: cargo check
        id: check
        run: cargo check --workspace --all-targets --locked

      # One test at a time: libtest prints each name before running it, so a crash
      # (not just a failed assertion) still shows which test caused it.
      - name: cargo test
        id: test
        env:
          THENEX_MODEL_PATH: ${{ github.workspace }}\thenex_model.onnx
          RUST_TEST_THREADS: "1"
          RUST_BACKTRACE: "1"
        run: python scripts/ci_run.py cargo test --workspace --locked --no-fail-fast

      # Real-malware regression floor: scores the committed EMBER2024 sample with the model
      # trained above. No download; the full evaluation only ever runs locally.
      - name: Binary AI on the EMBER2024 sample
        run: python scripts/ember_eval.py check

      # A native crash (e.g. STATUS_ACCESS_VIOLATION) has no Rust backtrace, so rerun the
      # core unit tests under cdb and print the faulting stack. Diagnostic only.
      - name: Native crash stack (only after a test failure)
        if: ${{ failure() && steps.test.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          THENEX_MODEL_PATH: ${{ github.workspace }}\thenex_model.onnx
        run: |
          $cdb = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
          if (-not (Test-Path $cdb)) { "cdb not found at $cdb"; exit 0 }
          $exe = $null
          foreach ($line in (cargo test -p the-nex-core --lib --no-run --locked --message-format=json)) {
            $msg = $line | ConvertFrom-Json
            if ($msg.reason -eq 'compiler-artifact' -and $msg.executable -and $msg.profile.test) { $exe = $msg.executable }
          }
          "core test binary: $exe"
          # -g/-G skip the initial and final breaks, so the first break-in is the fault itself.
          & $cdb -g -G -lines -c ".lastevent; .exr -1; r; kn 60; ~* kn 20; q" $exe --test-threads=1

      # The steps below still run when tests fail (the job stays failed) so one CI
      # run reports on the build and the live verifier too.
      - name: Release build
        id: release
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        run: cargo build --release --workspace --locked

      - name: Live end-to-end verification
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        run: python scripts/ci_run.py python scripts/verify_thenex.py --skip-build

      - name: Build TheNexSetup.exe (one-click installer)
        id: installer
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $stage = New-Item -ItemType Directory -Force -Path target\installer-stage
          Copy-Item target\release\the-nex.exe, target\release\the-nex-gui.exe, thenex_model.onnx, crates\the-nex-gui\icons\icon.ico -Destination $stage
          if (Test-Path known_bad.bin) { Copy-Item known_bad.bin -Destination $stage }
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { choco install nsis -y --no-progress | Out-Host }
          & $makensis /V3 "/DVERSION=$version" "/DSRCDIR=$($stage.FullName)" "/DOUTFILE=$((Resolve-Path target).Path)\TheNexSetup.exe" packaging\windows\installer.nsi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-Item target\TheNexSetup.exe | Format-List Name, Length

      # Rust and the Python code that built the training data must compute identical features
      # on real files, the model must stay quiet on this runner's own system programs, and our
      # binaries and installer must score clean.
      - name: Binary AI parity and false-positive check
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        run: |
          python -m pip install --disable-pip-version-check pefile
          python scripts/check_feature_parity.py --binary target\release\the-nex.exe --extra target\release\the-nex.exe --extra target\release\the-nex-gui.exe --extra target\TheNexSetup.exe

      # Every AegisMesh scenario for every form factor, in a sandbox that must stay empty.
      - name: AegisMesh simulation verification
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        run: python scripts/verify_aegismesh.py --skip-build --skip-tests

      # Installs for real on the runner (silent), checks the service is up, then uninstalls.
      - name: Installer smoke test (install, verify, uninstall)
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          $dir = Join-Path $env:ProgramData 'TheNex'
          $setup = Start-Process -FilePath target\TheNexSetup.exe -ArgumentList '/S' -Wait -PassThru
          if ($setup.ExitCode -ne 0) {
            Get-ChildItem $dir -ErrorAction SilentlyContinue | Format-Table Name, Length
            if (Test-Path "$dir\the-nex.exe") { & "$dir\the-nex.exe" --install }
            throw "TheNexSetup.exe /S exited with $($setup.ExitCode)"
          }
          foreach ($file in 'the-nex.exe', 'the-nex-gui.exe', 'thenex_model.onnx', 'Uninstall The Nex.exe') {
            if (-not (Test-Path (Join-Path $dir $file))) { throw "installer did not place $file" }
          }
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\The Nex\The Nex.lnk")) { throw 'Start menu shortcut missing' }
          if (-not (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\TheNex' -ErrorAction SilentlyContinue)) { throw 'not listed in Apps & Features' }
          $service = Get-Service -Name TheNex
          $service.WaitForStatus('Running', [TimeSpan]::FromSeconds(30))
          $status = Join-Path $dir 'logs\status.json'
          $deadline = (Get-Date).AddSeconds(45)
          while (-not (Test-Path $status) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
          if (-not (Test-Path $status)) { throw "the installed service never wrote $status" }
          Get-Content $status -Raw | ConvertFrom-Json | Format-List version, pid, model_loaded, watched_dirs

          # The app asks the service for scans through this folder: any local user may add a file
          # to it and nothing more, and the service picks the request up and can be told to stop.
          $requests = Join-Path $dir 'requests'
          $acl = icacls $requests
          $acl
          $users = $acl | Where-Object { $_ -match '\\Users:' }
          if (-not ($users -match 'Users:\(WD\)')) { throw 'local users cannot ask the service for a scan' }
          if ($users -match '\((F|M|W|AD|DC|D|WDAC|WO)\)') { throw 'local users may do more than add a request' }
          $progress = Join-Path $dir 'logs\scan_progress.json'
          New-Item -ItemType File (Join-Path $requests 'full-scan') | Out-Null
          $deadline = (Get-Date).AddSeconds(30)
          while (-not (Test-Path $progress) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          if (-not (Test-Path $progress)) { throw 'the service never started the requested full scan' }
          New-Item -ItemType File (Join-Path $requests 'cancel-scan') -Force | Out-Null
          "installed OK; uninstalling"

          # _?= runs the uninstaller in place so -Wait really waits for it.
          $remove = Start-Process -FilePath (Join-Path $dir 'Uninstall The Nex.exe') -ArgumentList '/S', "_?=$dir" -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "uninstaller exited with $($remove.ExitCode)" }
          if (Get-Service -Name TheNex -ErrorAction SilentlyContinue) { throw 'service still registered after uninstall' }
          foreach ($file in 'the-nex.exe', 'the-nex-gui.exe') {
            if (Test-Path (Join-Path $dir $file)) { throw "uninstaller left $file behind" }
          }
          if (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\TheNex' -ErrorAction SilentlyContinue) { throw 'still listed in Apps & Features' }
          "install + uninstall OK"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verify-sandbox-windows
          # Quarantined samples are locked (unreadable) and are live bombs; leave them out.
          path: |
            thenex_live_sandbox
            !thenex_live_sandbox/quarantine
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        with:
          name: the-nex-windows-x64
          path: |
            target/release/the-nex.exe
            target/release/the-nex-gui.exe
            thenex_model.onnx
            crates/the-nex-gui/icons/icon.ico
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        with:
          name: aegismesh-windows-x64
          path: |
            target/release/aegismesh-sim.exe
            target/release/aegismesh-gui.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        with:
          name: TheNexSetup-windows-x64
          path: target/TheNexSetup.exe
          if-no-files-found: error

  macos:
    name: macOS build, test, live verify and package
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check shell scripts parse
        run: for script in packaging/macos/*.sh; do bash -n "$script"; done

      - name: Generate icons and train the ONNX model
        run: |
          python scripts/gen_icons.py
          python -m pip install --disable-pip-version-check numpy onnx
          python scripts/train_onnx.py --out thenex_model.onnx
          python scripts/gen_test_zipbomb.py
          python scripts/fetch_hash_list.py --self-test
          python scripts/ember_eval.py --self-test
          python scripts/ci_run.py --self-test

      - name: Fetch the vision runtime and test the sign recogniser
        run: |
          python scripts/fetch_vision_models.py
          node scripts/test_signs.js
          node scripts/test_report.js
          node scripts/test_setup.js
          node scripts/test_filecheck.js
          node scripts/test_startup.js
          node scripts/test_summary.js

      - name: cargo check
        id: check
        run: cargo check --workspace --all-targets --locked

      - name: cargo test
        env:
          THENEX_MODEL_PATH: ${{ github.workspace }}/thenex_model.onnx
          RUST_BACKTRACE: "1"
        run: python scripts/ci_run.py cargo test --workspace --locked --no-fail-fast

      # Real-malware regression floor: scores the committed EMBER2024 sample with the model
      # trained above. No download; the full evaluation only ever runs locally.
      - name: Binary AI on the EMBER2024 sample
        run: python scripts/ember_eval.py check

      # Runs even when tests fail (the job stays failed) so one CI run reports on
      # packaging and the live verifier too.
      - name: Build TheNex.app and TheNex.dmg
        id: dmg
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        run: bash packaging/macos/build_dmg.sh

      - name: Live end-to-end verification
        if: ${{ !cancelled() && steps.dmg.outcome == 'success' }}
        run: python scripts/ci_run.py python scripts/verify_thenex.py --skip-build

      - name: AegisMesh simulation verification
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        run: |
          cargo build --release -p aegismesh-sim --locked
          python scripts/verify_aegismesh.py --skip-build --skip-tests

      # The Mach-O side is trained on synthetic profiles only, so this run on real macOS
      # programs is its reality check (no pefile parity on macOS: there are no PE files here).
      - name: Binary AI false-positive check
        if: ${{ !cancelled() && steps.dmg.outcome == 'success' }}
        run: |
          BIN=target/macos/TheNex.app/Contents/MacOS
          python scripts/check_feature_parity.py --binary "$BIN/the-nex" --extra "$BIN/the-nex" --extra "$BIN/the-nex-gui" --max-fpr 0.05 --max-fpr-third-party 0.05

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verify-sandbox-macos
          # Quarantined samples are locked (unreadable) and are live bombs; leave them out.
          path: |
            thenex_live_sandbox
            !thenex_live_sandbox/quarantine
          if-no-files-found: ignore

      - name: Verify bundle layout, plist and signature
        if: ${{ !cancelled() && steps.dmg.outcome == 'success' }}
        run: |
          APP=target/macos/TheNex.app
          test -x "$APP/Contents/MacOS/the-nex-gui"
          test -x "$APP/Contents/MacOS/the-nex"
          test -f "$APP/Contents/Resources/thenex_model.onnx"
          test -f "$APP/Contents/Resources/icon.icns"
          test -x "$APP/Contents/Resources/install_mac.sh"
          test -x "$APP/Contents/Resources/uninstall_mac.sh"
          plutil -lint "$APP/Contents/Info.plist"
          codesign --verify --deep --strict "$APP"
          hdiutil imageinfo target/macos/TheNex.dmg > /dev/null
          "$APP/Contents/MacOS/the-nex" --help

      - name: Build TheNex.pkg (one-click installer)
        id: pkg
        if: ${{ !cancelled() && steps.dmg.outcome == 'success' }}
        run: |
          bash packaging/macos/build_pkg.sh
          ls -l target/macos/TheNex.pkg

      # Installs for real on the runner, checks the LaunchDaemon is up, then uninstalls.
      - name: Installer smoke test (install, verify, uninstall)
        if: ${{ !cancelled() && steps.pkg.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          DATA="/Library/Application Support/TheNex"
          sudo installer -pkg target/macos/TheNex.pkg -target /
          test -x /Applications/TheNex.app/Contents/MacOS/the-nex
          test -x /Applications/TheNex.app/Contents/MacOS/the-nex-gui
          pkgutil --pkg-info com.thenex.pkg
          sudo test -f "$DATA/thenex_model.onnx"
          sudo launchctl print system/com.thenex.edr | grep -E '^[[:space:]]*(state|pid|program) =' || true
          for _ in $(seq 1 45); do
            sudo test -f "$DATA/logs/status.json" && break
            sleep 1
          done
          sudo test -f "$DATA/logs/status.json" || { echo "the installed daemon never wrote status.json"; exit 1; }
          sudo cat "$DATA/logs/status.json" | python3 -c 'import json,sys; s=json.load(sys.stdin); print({k: s[k] for k in ("version","pid","model_loaded")})'
          echo "installed OK; uninstalling"

          sudo /Applications/TheNex.app/Contents/Resources/uninstall_mac.sh --purge
          # launchd keeps the label "known" for a moment after bootout while the daemon
          # exits, so poll instead of checking once.
          for _ in $(seq 1 20); do
            sudo launchctl print system/com.thenex.edr >/dev/null 2>&1 || break
            sleep 1
          done
          if sudo launchctl print system/com.thenex.edr >/dev/null 2>&1; then
            echo "daemon still loaded 20s after uninstall"; exit 1
          fi
          test ! -e /Library/LaunchDaemons/com.thenex.edr.plist
          sudo rm -rf /Applications/TheNex.app
          sudo pkgutil --forget com.thenex.pkg
          echo "install + uninstall OK"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.dmg.outcome == 'success' }}
        with:
          name: the-nex-macos
          path: |
            target/macos/TheNex.dmg
            target/macos/TheNex.pkg
          if-no-files-found: warn

  # Pushing a tag like v0.3.0 publishes a GitHub Release with the installers attached.
  release:
    name: Publish release
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -R dist
          # What's new (release-notes/<tag>.md, if there is one) followed by the install guide.
          if [ -f "release-notes/$GITHUB_REF_NAME.md" ]; then
            cat "release-notes/$GITHUB_REF_NAME.md" INSTALL.md > release-body.md
          else
            cp INSTALL.md release-body.md
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/TheNexSetup-windows-x64/TheNexSetup.exe \
            dist/the-nex-macos/TheNex.pkg \
            dist/the-nex-macos/TheNex.dmg \
            --title "The Nex $GITHUB_REF_NAME" \
            --notes-file release-body.md
