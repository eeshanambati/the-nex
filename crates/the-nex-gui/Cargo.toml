[package]
name = "the-nex-gui"
description = "The Nex desktop app (Tauri v2, plain HTML/CSS/JS frontend in ui/)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "the-nex-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
the-nex-core.workspace = true
aegismesh-core.workspace = true
tauri = { workspace = true, features = ["tray-icon", "image-png", "macos-private-api"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
ureq.workspace = true
native-tls.workspace = true
url.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Already in the lockfile through tauri; used for the camera permission prompt.
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }
