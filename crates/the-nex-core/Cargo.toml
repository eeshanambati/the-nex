[package]
name = "the-nex-core"
description = "The Nex EDR engine: detectors, quarantine, AI scoring and the Windows/macOS OS layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "the_nex_core"
path = "src/lib.rs"

[dependencies]
notify.workspace = true
zip.workspace = true
goblin.workspace = true
tract-onnx.workspace = true
sysinfo.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
notify-rust.workspace = true
sha2.workspace = true
memmap2.workspace = true

# Hardware SHA-256 on Apple Silicon. Without it sha2 hashes in software there (about
# 340 MB/s on an M2), which nearly doubled quick-scan time once every file is hashed for the
# known-malware list. x86 detects SHA-NI at run time with no feature.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

# Symlink- and FIFO-safe file handling in the root daemon (openat/O_NOFOLLOW/O_NONBLOCK).
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-service.workspace = true
windows-sys.workspace = true
