[workspace]
resolver = "2"
members = [
    "crates/the-nex-core",
    "crates/the-nex-daemon",
    "crates/the-nex-gui",
    "crates/aegismesh-core",
    "crates/aegismesh-sim",
    "crates/aegismesh-gui",
]

[workspace.package]
version = "0.4.1"
edition = "2021"
# The highest the dependencies in Cargo.lock ask for.
rust-version = "1.96"
publish = false

[workspace.dependencies]
the-nex-core = { path = "crates/the-nex-core" }
aegismesh-core = { path = "crates/aegismesh-core" }
notify = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }
goblin = "0.9"
tract-onnx = "0.21"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
notify-rust = "4"
sha2 = "0.10"
memmap2 = "0.9"
zeroize = { version = "1", features = ["derive"] }
# OS CSPRNG for AegisMesh ephemeral keys and nonces (already in the lockfile via tauri).
getrandom = "0.2"
windows-service = "0.7"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
tauri = "2"
tauri-build = "2"
embed-resource = "3"
# Wallpaper page-URL resolver in the desktop app: OS TLS (Schannel / Security.framework),
# no C toolchain needed.
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
url = "2"

[profile.release]
# Symbols are a quarter of the programs' size. Unwinding stays: the engine recovers from panics.
strip = true
